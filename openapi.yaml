  schemas:

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The one error shape for every non-2xx response in this API, including routing 404s, auth
        failures and unhandled exceptions. Clients branch on `error.code` only.
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: Human English. Unstable, never parsed, never carries a stack trace or an internal path.
        requestId:
          type: string
          description: Equal to the `X-Request-Id` header.
        details:
          type: [object, "null"]
          description: |
            Code-specific, with a fixed shape per code (`SERVER_SPEC.md` § 5). Absent for codes that
            define none.
          additionalProperties: true
        session:
          description: |
            Present **iff** a session is open when the error is produced **and the caller is
            authenticated**, and **required** for every 409 on a `/session*` endpoint. Identical to
            what `GET /session` would return at that instant — this is what makes a stale token
            recoverable in one round trip.

            MUST be omitted on **401** and **403**: the snapshot carries the open folder's absolute
            path and its contents, so attaching it to an authentication failure would hand a caller
            who just failed to present a token exactly what the token protects. MUST also be omitted
            on **503 `session_busy`**, where not holding the session lock *is* the failure being
            reported (`SERVER_SPEC.md` § 4).
          oneOf:
            - { $ref: '#/components/schemas/SessionSnapshot' }
            - { type: "null" }

    ErrorCode:
      type: string
      description: |
        Stable machine-readable code. New codes may be added; existing ones never change meaning or
        status.
      enum:
        - unauthenticated
        - invalid_token
        - token_revoked
        - invalid_pairing_code
        - pairing_not_open
        - too_many_requests
        - invalid_request
        - missing_field
        - invalid_side
        - invalid_media_id
        - unsupported_width
        - unsupported_format
        - invalid_path
        - unsupported_content_type
        - payload_too_large
        - not_found
        - no_session
        - session_already_open
        - folder_not_found
        - folder_not_a_directory
        - folder_access_denied
        - folder_not_rankable
        - library_json_unreadable
        - folder_locked
        - session_busy
        - server_shutting_down
        - stale_pair_token
        - no_current_pair
        - nothing_to_undo
        - undo_folder_changed
        - move_failed
        - save_failed
        - unknown_media_id
        - media_file_missing
        - media_outside_session
        - media_extension_not_allowed
        - wrong_media_kind
        - media_decode_failed
        - range_not_satisfiable
        - internal_error

    SessionState:
      type: string
      description: |
        `ranking` — `RankingSession.Current` is non-null. `exhausted` — the session is open but
        fewer than two eligible records remain, so there is no pair; escapable only by `undo` or by
        closing and reopening. A folder that cannot produce a first pair never opens at all
        (`409 folder_not_rankable`).
      enum: [ranking, exhausted]

    MediaKind:
      type: string
      enum: [still, video]

    Side:
      type: string
      enum: [left, right]

    Cue:
      type: string
      description: |
        Session-only match strip (`SPEC.md` § Match strip). Appended on **vote** only, before the
        TrueSkill update: `confirmation` when the winner's μ was ≥ the loser's, else `upset`. Skip,
        discard, special and undo append nothing. Never written to `rankmaster_db.json`.
      enum: [confirmation, upset]

    ActionType:
      type: string
      description: |
        `drop_missing` is a discard whose file was already gone from disk: the record is dropped and
        saved, no file is moved, and no undo entry is recorded.
      enum: [vote, skip, discard, special, undo, drop_missing]

    SessionSnapshot:
      type: object
      additionalProperties: false
      required:
        [sessionId, state, folder, folderName, policy, openedAt, prefetchPairs, sessionVotes,
         counts, progress, progressPercent, cues, pair, pairToken, pairSeq, warmPairs,
         undoAvailable, lastAction, lastSavedAt]
      description: |
        The complete state of the one session. Returned by every successful `/session*` call and
        embedded in `error.session` on a conflict, so a client is never more than one response away
        from being fully synchronised.
      properties:
        sessionId:
          type: string
          description: |
            Opaque. New on every `POST /session` that opens a session, and therefore new after a
            server restart. A change voids every cached `pairToken`, `lastAction` and link.
          examples: ["Qv8kZ2r5tN0pXbA1cD3eFg"]
        state: { $ref: '#/components/schemas/SessionState' }
        folder:
          type: string
          description: The absolute, fully-resolved folder path.
        folderName:
          type: string
          description: '`RankingSession.FolderName` — the last path segment. May be empty for a drive root.'
        policy:
          allOf: [{ $ref: '#/components/schemas/MediaKind' }]
          description: |
            Which kind is rankable in this folder. Only stills, or only videos, or — for a mixed
            folder — **stills only** (`SPEC.md` § Media policy).
        openedAt: { type: string, format: date-time }
        prefetchPairs:
          type: integer
          minimum: 0
          description: Warm depth; 2 by default (`SPEC.md` § Pipeline). `warmPairs` never exceeds it.
        sessionVotes:
          type: integer
          minimum: 0
          description: Votes only. Skip, discard, special and undo do not count. Not persisted; reset by a new session.
        counts: { $ref: '#/components/schemas/Counts' }
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: |
            `LibraryProgress.Of(Rankable)`, rounded to 6 decimals — the mean fraction of the path
            from the initial σ to the target σ. Overlay maths only; not a picker input, and not a
            measurement (a discard moves it for reasons unrelated to voting).
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: '`round(progress * 100)` — the number the desktop overlay shows.'
        cues:
          type: array
          maxItems: 10
          description: Oldest first. Empty until the first vote of the session.
          items: { $ref: '#/components/schemas/Cue' }
        pair:
          description: The current pair, or null when `state` is `exhausted`.
          oneOf:
            - { $ref: '#/components/schemas/Pair' }
            - { type: "null" }
        pairToken:
          type: [string, "null"]
          description: |
            Opaque per-pair token; null exactly when `pair` is null. Required by every pair action.
            It is derived from `HMAC(sessionSecret, sessionId | pairSeq | left | right)`, so it
            changes on **every** advance even when the pair's ids repeat — which they do on a
            two-file library, where `Advance()` re-picks the same two files forever. Never parse it,
            never reuse one across `sessionId` values.
          examples: ["M0xQrT8vB3nJ7yE2sW9uHk"]
        pairSeq:
          type: integer
          minimum: 0
          description: |
            Monotonic per session, starting at 0. Incremented iff the server entered `VoteLeft`,
            `VoteRight`, `Skip`, `Drop` or `Restore` — and, for the three that save internally, only
            when that call returned without throwing. Exposed for logging and ordering; it is not a
            token and must never be sent in an action body.
        warmPairs:
          type: array
          description: |
            Prefetch hints, in dequeue order. They carry no token and must never be acted on. A warm
            pair may be one vote stale, may be evicted by a discard, is always discarded by an undo,
            and may never become current. On a two-file library this is permanently empty, because
            both ids are reserved by the current pair — a client that waits for a warm pair before
            rendering will hang.
          items: { $ref: '#/components/schemas/Pair' }
        undoAvailable:
          type: boolean
          description: |
            A move is recorded and belongs to this folder. One level only — there is no undo stack,
            and vote undo does not exist.
        lastAction:
          description: |
            The most recent **successful** mutation. Null right after a session opens. In-memory
            only: a server restart loses it, and with it the ability to tell whether an in-flight
            action landed.
          oneOf:
            - { $ref: '#/components/schemas/LastAction' }
            - { type: "null" }
        lastSavedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When *this session* last wrote `rankmaster_db.json`. Null for a freshly opened session,
            even though the file on disk may be much older — `Start()` reads and does not write.

    Counts:
      type: object
      additionalProperties: false
      required: [total, rankable, unranked, stills, videos]
      description: '`stills + videos == total`; `rankable == stills` when `policy` is `still`, else `videos`.'
      properties:
        total: { type: integer, minimum: 0, description: 'Every media file found by the scan, both kinds.' }
        rankable: { type: integer, minimum: 0, description: 'Records matching `policy`.' }
        unranked:
          type: integer
          minimum: 0
          description: 'Rankable records with `matches == 0` — the overlay''s "unranked" number.'
        stills: { type: integer, minimum: 0 }
        videos:
          type: integer
          minimum: 0
          description: |
            In a mixed folder these are visible and fetchable but can never appear in a pair. A
            client must not imply they are rankable.

    Pair:
      type: object
      additionalProperties: false
      required: [left, right]
      description: |
        Two distinct records. `PairSelector` never returns the same id twice.

        Ratings are deliberately **not** included: the desktop compare screen shows no μ, σ or score,
        and a client that displayed them would bias the vote it is collecting. Use
        `GET /media/{id}/meta` if tooling needs them.
      properties:
        left: { $ref: '#/components/schemas/MediaRef' }
        right: { $ref: '#/components/schemas/MediaRef' }

    MediaRef:
      type: object
      additionalProperties: false
      required: [id, kind, sizeBytes, mediaVersion, links]
      properties:
        id:
          type: string
          description: |
            The **decoded** filename exactly as on disk (`MediaId.Filename`) — not URL-encoded.
            Filenames are the identity; there is no GUID. Echo this spelling; do not re-case it.
        kind: { $ref: '#/components/schemas/MediaKind' }
        sizeBytes:
          type: [integer, "null"]
          minimum: 0
          description: Null when the file could not be stat'd — it has been moved or deleted under the session.
        mediaVersion:
          type: [string, "null"]
          description: 16 lowercase hex characters over `(id, size, mtime)`. Null when `sizeBytes` is null.
          examples: ["9f2a1c77b0e4d310"]
        links: { $ref: '#/components/schemas/MediaLinks' }

    MediaLinks:
      type: object
      additionalProperties: false
      required: [meta, still, thumb, video]
      description: |
        Server-built, already percent-encoded, already carrying `v=<mediaVersion>`. Clients should
        use these verbatim rather than building URLs — it removes every id-encoding bug from four
        client implementations at once, and the `v` is what makes `immutable` honest.
      properties:
        meta: { type: string }
        still:
          type: [string, "null"]
          description: Null for a video. There are no poster frames.
        thumb:
          type: [string, "null"]
          description: Null for a video.
        video:
          type: [string, "null"]
          description: Null for a still.

    LastAction:
      type: object
      additionalProperties: false
      required: [seq, type, pairToken, clientRequestId, winner, side, id, restoredId, at]
      description: |
        Retry disambiguation. After a `409 stale_pair_token`, a client compares its own
        `clientRequestId` and `pairToken` against these fields to learn whether its lost request
        landed — without polling and without risking a double vote.
      properties:
        seq: { type: integer, minimum: 0, description: 'The `pairSeq` this action produced.' }
        type: { $ref: '#/components/schemas/ActionType' }
        pairToken:
          type: [string, "null"]
          description: The token this action consumed. Null for `undo` and `drop_missing`, which take none.
        clientRequestId:
          type: [string, "null"]
          description: Echoed verbatim from the request, or null if the client sent none.
        winner:
          description: '`vote` only.'
          oneOf: [{ $ref: '#/components/schemas/Side' }, { type: "null" }]
        side:
          description: '`discard` and `special` only.'
          oneOf: [{ $ref: '#/components/schemas/Side' }, { type: "null" }]
        id:
          type: [string, "null"]
          description: The id moved or dropped — `discard`, `special`, `drop_missing`.
        restoredId:
          type: [string, "null"]
          description: |
            `undo` only. **Differs from `id`** when the original name had been taken and
            `FileOps.UniqueFileName` brought the file back as `name (2).ext`. Any URL cached for the
            old id is then dead.
        at: { type: string, format: date-time }

    OpenSessionRequest:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute path. Relative paths, empty strings and NUL bytes are `400 invalid_path`.

    VoteRequest:
      type: object
      additionalProperties: false
      required: [pairToken, winner]
      properties:
        pairToken:
          type: string
          description: Must equal the current token, or the call is `409 stale_pair_token` with no state change.
        winner: { $ref: '#/components/schemas/Side' }
        clientRequestId: { $ref: '#/components/schemas/ClientRequestId' }

    SkipRequest:
      type: object
      additionalProperties: false
      required: [pairToken]
      properties:
        pairToken: { type: string }
        clientRequestId: { $ref: '#/components/schemas/ClientRequestId' }

    SideRequest:
      type: object
      additionalProperties: false
      required: [pairToken, side]
      description: |
        The id is taken from the pair the token names — a client sends a side, never an id, so it
        cannot act on an item that is not on screen.
      properties:
        pairToken: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        clientRequestId: { $ref: '#/components/schemas/ClientRequestId' }

    UndoRequest:
      type: object
      additionalProperties: false
      description: |
        No `pairToken`: undo is not pair-scoped, and any token the client holds for the pair the
        move happened in is stale by construction. A `pairToken` sent here is ignored.
      properties:
        clientRequestId: { $ref: '#/components/schemas/ClientRequestId' }

    ClientRequestId:
      type: [string, "null"]
      maxLength: 64
      description: |
        Client-generated, unique per logical action and **kept identical across retries of that
        action**. Strongly recommended: it is echoed in `lastAction.clientRequestId`, and it is the
        only thing that lets a client prove a lost request landed rather than inferring it.
      examples: ["1f0c2a7e-6b41-4f0a-9f6a-2b3c4d5e6f70"]

    Rating:
      type: object
      additionalProperties: false
      required: [mu, sigma, conservative]
      properties:
        mu: { type: number }
        sigma: { type: number, minimum: 0 }
        conservative:
          type: number
          description: '`μ − 3σ`. Computed on read, never stored (`SPEC.md` § Persistence).'

    MediaMeta:
      type: object
      additionalProperties: false
      required: [id, kind, sizeBytes, modifiedAt, mediaVersion, width, height, rating, matches, impressions, lastPlayed, rankable]
      description: |
        No `durationMs`, `codec`, `frameRate` or `bitrate`: producing any of them would mean decoding
        a video, which this server never does (`SERVER_PLAN.md` § 7).
      properties:
        id: { type: string, description: The on-disk spelling. }
        kind: { $ref: '#/components/schemas/MediaKind' }
        sizeBytes: { type: integer, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
        mediaVersion: { type: string }
        width:
          type: [integer, "null"]
          description: Stills only, after EXIF orientation. Always null for a video.
        height:
          type: [integer, "null"]
          description: Stills only, after EXIF orientation. Always null for a video.
        rating: { $ref: '#/components/schemas/Rating' }
        matches:
          type: integer
          minimum: 0
          description: Incremented on vote only (`SPEC.md` § Ranking).
        impressions:
          type: integer
          minimum: 0
          description: |
            Incremented on vote **and** skip, on both ids. Displaying a pair, prefetching it,
            fetching its bytes or closing the session never increments it. Written for
            compatibility; never used to pick pairs.
        lastPlayed:
          type: integer
          description: Unix **milliseconds**, exactly as stored in `rankmaster_db.json`. 0 if never voted.
        rankable: { type: boolean, description: Whether this record matches the session `policy`. }

    PairRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          maxLength: 32
          description: The one-time pairing code. Whitespace is ignored; the comparison is constant-time.
        deviceName:
          type: [string, "null"]
          maxLength: 64
          description: Shown in the device list so the user knows what to revoke.

    PairResponse:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, token, issuedAt, expiresAt]
      properties:
        deviceId:
          type: string
          description: 'Pass to `DELETE /pair/{deviceId}` to revoke.'
        deviceName: { type: [string, "null"] }
        token:
          type: string
          description: |
            The bearer token. Returned **once** and never retrievable again. Send it only in the
            `Authorization` header.
        issuedAt: { type: string, format: date-time }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Null for a non-expiring token.

    Ping:
      type: object
      additionalProperties: false
      required: [product, apiVersion, version, ready, authenticated, certificateFingerprint, serverTime, features, limits, session]
      properties:
        product: { type: string }
        apiVersion: { type: string, examples: ["v1"] }
        version: { type: string, description: 'Assembly version from `Directory.Build.props`.' }
        ready:
          type: boolean
          description: False while starting or shutting down; every other endpoint answers `503 server_shutting_down` then.
        authenticated: { type: boolean }
        certificateFingerprint:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: |
            SHA-256 of the certificate's DER encoding. This is what the client pins — it is the whole
            reason a self-signed certificate is secure here rather than theatre. In the public subset
            because a client that cannot authenticate yet is exactly the one that needs it.
        serverTime: { type: string, format: date-time }
        features: { $ref: '#/components/schemas/PingFeatures' }
        limits: { $ref: '#/components/schemas/PingLimits' }
        session:
          description: Null in the public subset. Authenticated, a cheap "is a session open" without a 404.
          oneOf:
            - { $ref: '#/components/schemas/PingSession' }
            - { type: "null" }

    PingFeatures:
      type: object
      additionalProperties: false
      required: [rename, videoTranscoding, posterFrames, videoProbe, browse, maxConcurrentSessions]
      description: Fixed by `SERVER_PLAN.md` § 7. Not configurable.
      properties:
        rename:
          type: boolean
          const: false
          description: |
            Always false. There is no rename-by-rank endpoint, no flag and no build in which one
            exists; `LibraryActions.RenameByRank` is never called by the server.
        videoTranscoding: { type: boolean, const: false }
        posterFrames: { type: boolean, const: false }
        videoProbe: { type: boolean, const: false, description: The server never decodes a video frame. }
        browse: { type: string, const: full-filesystem }
        maxConcurrentSessions: { type: integer, const: 1 }

    PingLimits:
      type: object
      additionalProperties: false
      required: [stillWidths, thumbWidth, maxJsonBodyBytes, sessionLockTimeoutSeconds]
      properties:
        stillWidths:
          type: array
          items: { type: integer }
          description: The only accepted `w` values. Anything else is `400 unsupported_width`.
        thumbWidth: { type: integer, const: 320 }
        maxJsonBodyBytes: { type: integer }
        sessionLockTimeoutSeconds: { type: integer }

    PingSession:
      type: object
      additionalProperties: false
      required: [open, sessionId, folder, state]
      properties:
        open: { type: boolean }
        sessionId: { type: [string, "null"] }
        folder: { type: [string, "null"] }
        state:
          oneOf:
            - { $ref: '#/components/schemas/SessionState' }
            - { type: "null" }

    RootsResponse:
      type: object
      additionalProperties: false
      required: [roots]
      properties:
        roots:
          type: array
          items: { $ref: '#/components/schemas/RootEntry' }

    RootEntry:
      type: object
      additionalProperties: false
      required: [path, label, kind, available, totalBytes, freeBytes]
      properties:
        path: { type: string }
        label: { type: [string, "null"] }
        kind: { type: string, enum: [fixed, removable, network, ram, unknown] }
        available:
          type: boolean
          description: |
            A root that exists but is not ready — an empty optical drive, a disconnected share — is
            still listed, with false here, rather than being silently dropped.
        totalBytes: { type: [integer, "null"] }
        freeBytes: { type: [integer, "null"] }

    BrowseResponse:
      type: object
      additionalProperties: false
      required: [path, parent, entries]
      properties:
        path: { type: string }
        parent: { type: [string, "null"], description: Null at a root. }
        entries:
          type: array
          items: { $ref: '#/components/schemas/BrowseEntry' }

    BrowseEntry:
      type: object
      additionalProperties: false
      required: [name, path, stillCount, videoCount, rankable, hasDatabase, accessible]
      description: |
        Direct child folders only; files are never listed. Counts apply `SPEC.md` § Media policy to
        the **top-level files of that child**: same extension lists, same skipping of hidden and
        system files and of `rankmaster_db.json`.
      properties:
        name: { type: string }
        path: { type: string }
        stillCount:
          type: [integer, "null"]
          description: Null means unknown — not counted, or not readable. Zero means counted and empty.
        videoCount: { type: [integer, "null"] }
        rankable:
          type: [boolean, "null"]
          description: |
            Would this folder open? The same predicate `POST /session` applies, so a client can grey
            out folders that would answer `409 folder_not_rankable`. Null when counts were skipped or
            the folder is unreadable.
        hasDatabase:
          type: boolean
          description: '`rankmaster_db.json` exists. Says nothing about whether it parses.'
        accessible:
          type: boolean
          description: |
            False when the child could not be enumerated. One unreadable child never fails the whole
            listing.
